; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr @ 5.3.0
board = ATmega328PB
framework = arduino
build_src_filter = +<main.cpp>
board_build.f_cpu = 16000000L
; Uno-style USB serial bootloader. For MiniCore Urboot use urclock instead.
upload_protocol = arduino
upload_speed = 115200
; PlatformIO reserves the serial bootloader space automatically.
lib_deps =
    arduino-libraries/LiquidCrystal @ ^1.0.7
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.15

; Isolated motor/driver diagnostic, controlled through the serial monitor.
[env:stepper_test]
extends = env:uno
build_src_filter = +<stepper_test.cpp>
monitor_speed = 115200
